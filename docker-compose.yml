services:
  mysql:
    image: mysql:8.4
    container_name: app_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:22-alpine
    container_name: app_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app_network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: app_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app_network

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - app_network
    command: php artisan queue:work rabbitmq --tries=3 --sleep=3

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  app_network:
    driver: bridge